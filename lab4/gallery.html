<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <h1 class="gallery">Галерея Струтинського Михайла Михайловича</h1>
    <a class="backtomain" href="index.html">Назад на головну</a>
    <h2 class="myimg_text">Мої зображення</h2>

    <div class="gallery_container">
        <div class="gallery_item">
            <h3 class="myimg_text_infolder">Зображення у цій папці</h3>
            <img class="image_center" alt="folder" src="600.svg">
        </div>

        <div class="gallery_item">
            <h3 class="myimg_text_images">Зображення у папці images</h3>
            <img class="image_center" alt="images" src="./images/600.svg">
        </div>

        <div class="gallery_item">
            <h3 class="myimg_text_online">Зображення онлайн</h3>
            <img class="image_center" alt="online" src="https://placehold.co/1280x1024">
        </div>
    </div>
</body>
</html>
